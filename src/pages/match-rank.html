<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ee" />
    <link rel="icon" type="image/png" href="/src/assets/images/search-mascot.png" />
    <title>맛궁합 랭킹 - T:MATE</title>
    <link rel="stylesheet" href="/src/css/index.css" />
    <link rel="stylesheet" href="/src/pages/match-rank.css" />
  </head>
  <body>
    <!-- 부스의 큰 화면(컴퓨터·TV)용이라 402px 모바일 프레임(.app)을 쓰지 않는다 -->
    <main class="rank" id="app">
      <header class="rank__head">
        <h1 class="rank__title">오늘의 맛궁합 랭킹</h1>
        <p class="rank__desc">T:MATE 홈의 배너를 누르고 친구와 같은 방에서 검사해 보세요</p>
      </header>
      <aside class="rank__qr">
        <img class="rank__qr-image" src="/src/assets/images/site-qr.svg" alt="T:MATE 바로가기 QR 코드 (t-mate.vercel.app)" width="160" height="160" />
        <p class="rank__qr-text">카메라로 찍으면<br />바로 시작!</p>
      </aside>
      <section class="rank__photos" id="photos" hidden></section>
      <div class="rank__body" id="body"></div>
      <p class="rank__updated" id="updated"></p>
      <p class="rank__tools"><a class="rank__tool-link" id="print-link" href="#">영수증 인쇄 (진행자용)</a></p>
    </main>
    <script type="module" src="/src/pages/match-rank.ts"></script>
  </body>
</html>
