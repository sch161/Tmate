<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ee" />
    <link rel="icon" type="image/png" href="/src/assets/images/search-mascot.png" />
    <title>회원가입 - T:MATE</title>
    <link rel="stylesheet" href="/src/css/index.css" />
    <link rel="stylesheet" href="/src/pages/auth.css" />
  </head>
  <body>
    <main class="app auth">
      <img class="auth__logo" src="/src/assets/images/logo.png" alt="T:MATE" width="210" height="150" />
      <div class="auth__brand">
        <span class="auth__checker" aria-hidden="true"></span>
        <h1 class="auth__title">Taste Mate</h1>
        <span class="auth__checker" aria-hidden="true"></span>
      </div>

      <form class="auth__form" id="auth-form" novalidate>
        <div class="auth__field">
          <input class="input" id="username" name="username" type="text" placeholder="아이디를 입력해주세요" autocomplete="username" autocapitalize="none" maxlength="20" />
          <p class="error-message" id="username-error" role="alert" hidden></p>
        </div>
        <div class="auth__field">
          <input class="input" id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요" autocomplete="new-password" />
          <p class="error-message" id="password-error" role="alert" hidden></p>
        </div>
        <p class="error-message auth__form-error" id="form-error" role="alert" hidden></p>
        <button class="btn-primary auth__submit" id="submit" type="submit">회원가입</button>
      </form>

      <!-- 디자인 대기: 체험 안내 문구는 Figma 에 없는 임시 UI -->
      <div class="auth__notice">
        <!-- TODO: 운영 방침 확인 (행사가 끝나면 입력 정보를 삭제하는 것이 실제 운영 방침과 맞는지) -->
        <p class="text-wrap-ko">체험용 서비스예요. 입력한 입맛·알레르기 정보는 체험을 위해서만 쓰이고, 행사가 끝나면 삭제돼요.</p>
        <p class="text-wrap-ko">비밀번호는 다른 곳에서 쓰는 것과 다르게 정해 주세요. 비밀번호 찾기는 지원하지 않아요.</p>
      </div>

      <p class="auth__switch">
        <span>이미 계정이 있으신가요?</span>
        <a class="auth__switch-link--strong" href="/src/pages/login.html">로그인</a>
      </p>
    </main>
    <script type="module" src="/src/pages/signup.ts"></script>
  </body>
</html>
