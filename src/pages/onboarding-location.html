<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>위치 설정 - T:MATE</title>
    <link rel="stylesheet" href="/src/css/index.css" />
    <link rel="stylesheet" href="/src/pages/onboarding.css" />
  </head>
  <body>
    <main class="app onboarding">
      <div class="onboarding__progress"><div class="progress" style="--value: 37"></div></div>
      <header class="onboarding__head">
        <!-- 디자인 대기: Figma 문구와 다름 (실제로는 위치 권한을 요청하지 않고 지역 목록에서 고른다) -->
        <h1 class="onboarding__title">내 지역을 선택해주세요</h1>
        <p class="onboarding__desc">선택한 지역의 맛집을<br />추천해 드려요</p>
      </header>
      <section class="onboarding__body onboarding__body--center" id="body">
        <img class="onboarding__map" src="/src/assets/images/onboarding-map.svg" alt="" width="181" height="125" />
        <p class="onboarding__region" id="region-text" hidden></p>
      </section>
      <footer class="onboarding__footer">
        <button class="btn-primary" id="next" type="button">지역 선택하기</button>
      </footer>
    </main>
    <script type="module" src="/src/pages/onboarding-location.ts"></script>
  </body>
</html>
